name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published package version to set as latest (for example, 1.5.4)
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Run quality checks before publishing
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

  # Publish to npm registry
  publish-npm:
    name: Publish to npm
    needs: quality
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm CLI with Trusted Publishing support
        run: npm install --global npm@latest

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

  # Move npm's latest tag after a new publish, or manually promote an existing version.
  promote-npm-latest:
    name: Promote npm version to latest
    needs: [quality, publish-npm]
    if: always() && needs.quality.result == 'success' && (needs.publish-npm.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm CLI with Trusted Publishing support
        run: npm install --global npm@latest

      - name: Promote published version to latest
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          npm dist-tag add "lumina-mcp@$VERSION" latest

  # Publish to GitHub Packages
  publish-github:
    name: Publish to GitHub Packages
    needs: quality
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@Wahyu-Labs'

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Configure package for GitHub Packages
        run: |
          # Temporarily scope the package name for GitHub Packages
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@wahyu-labs/lumina-mcp';
            pkg.repository = {
              type: 'git',
              url: 'https://github.com/Wahyu-Labs/lumina-mcp.git'
            };
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
